name: Deploy Hugo site to Codeberg Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: codeberg-tiny
    container:
      image: hugomods/hugo:exts
    steps:
      - name: Checkout source
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install docutils for .rst rendering
        run: apk add --no-cache py3-docutils

      - name: Build site
        run: hugo --minify

      - name: Push to pages branch
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git config --global user.email ci@infra.yasec.de
          git config --global user.name "Ashen CI"
          git clone --depth 1 -b pages "https://${CODEBERG_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git" pages-out
          cp -ar public/. pages-out/
          cp .domains pages-out/ || true   # needed for custom domains
          cd pages-out
          git add .
          git commit -m "Ashen Forgejo Actions CI ${GITHUB_SHA}" || echo "No changes to commit"
          git push
