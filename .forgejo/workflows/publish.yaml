name: Deploy Hugo site to Codeberg Pages

on:
  push:
    branches:
      - main

env:
  HUGO_VERSION: 0.164.0

jobs:
  build-and-deploy:
    runs-on: codeberg-tiny
    container:
      image: code.forgejo.org/oci/node:22-bookworm
    steps:
      - name: Checkout source
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo and docutils
        run: |
          apt-get update -qq
          apt-get install -y -qq docutils
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o /tmp/hugo.deb
          dpkg -i /tmp/hugo.deb
          hugo version

      - name: Build site
        run: hugo --minify

      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://ashen.yasec.de/
          server: codeberg.page
          token: ${{ forge.token }}
          source: public/
